name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests And Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: energy_forecast_test
          POSTGRES_USER: pfe_test
          POSTGRES_PASSWORD: test-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pfe_test -d energy_forecast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pfe_test:test-database-password@localhost:5432/energy_forecast_test
      DEBUG: "true"
      JWT_SECRET_KEY: ci-only-jwt-secret-with-more-than-32-characters
      ADMIN_PASSWORD: ci-only-admin-password
      LEGAL_OWNER_NAME: EnergyForecast CI
      LEGAL_CONTACT_EMAIL: legal-ci@example.test
      SUPPORT_EMAIL: support-ci@example.test
      LEGAL_EFFECTIVE_DATE: "2026-07-23"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ml.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Migrate an empty Postgres database
        working-directory: backend
        run: python -m app.cli migrate

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Build backend test image
        run: docker build --build-arg INSTALL_TORCH=0 --target test -t energy-backend-test -f backend/Dockerfile .

      - name: Run tests in the backend test image
        run: >-
          docker run --rm
          -e DATABASE_URL=sqlite:///./energy_forecast.db
          -e DEBUG=true
          -e JWT_SECRET_KEY=ci-only-jwt-secret-with-more-than-32-characters
          -e ADMIN_PASSWORD=ci-only-admin-password
          energy-backend-test python -m pytest -q

  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Install browser engines
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Product V1 browser matrix
        working-directory: frontend
        run: npm run test:browser

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, frontend, secret-scan]
    env:
      POSTGRES_PASSWORD: ci-compose-database-password
      JWT_SECRET_KEY: ci-compose-jwt-secret-with-more-than-32-characters
      ADMIN_PASSWORD: ci-compose-admin-password
      DEBUG: "false"
      LEGAL_OWNER_NAME: EnergyForecast CI
      LEGAL_CONTACT_EMAIL: legal-ci@example.test
      SUPPORT_EMAIL: support-ci@example.test
      LEGAL_EFFECTIVE_DATE: "2026-07-23"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start stack
        run: docker compose up --build --detach

      - name: Wait for live services and model readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/api/v1/system/live >/dev/null && curl --fail --silent http://localhost:8000/api/v1/system/ready >/dev/null && curl --fail --silent http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs backend frontend
          exit 1

      - name: Stop stack
        if: always()
        run: docker compose down --volumes
