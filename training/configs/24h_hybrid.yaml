# 24h Hybrid v2 Baseline Configuration
experiment_name: "24h_hybrid_v2_baseline"
model:
  name: "Hybrid_v2"
  lookback: 96
  forecast_horizon: 24
  num_targets: 7
  d_model: 64
  d_channel: 256
  patch_len: 16
  stride: 8

data:
  dataset_name: "uci_electricity"
  batch_size: 64
  use_weather: true
  use_cyclical_calendar: true
  latitude: 48.8566
  longitude: 2.3522 # Assuming Paris/France for UCI dataset

training:
  epochs: 100
  learning_rate: 0.001
  loss: "huber" # options: mse, mae, huber, quantile
  early_stopping_patience: 10
  mixed_precision: true
  gradient_clipping: 1.0
  weight_decay: 1e-4

evaluation:
  metrics: ["MAE", "RMSE", "MAPE", "sMAPE", "R2"]
  walk_forward_splits: 3
